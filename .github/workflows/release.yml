name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Release writes (the Version Packages PR, tags and GitHub Releases) use
      # a GitHub App token instead of `GITHUB_TOKEN`. Events caused by
      # `GITHUB_TOKEN` don't trigger other workflows, so the Docker workflow
      # would never build release tags, and checks on the Version Packages PR
      # would wait for manual approval.
      #
      # Requires a GitHub App installed on this repo with Contents and Pull
      # requests read & write, its Client ID in the `RELEASE_APP_CLIENT_ID`
      # variable and its private key in the `RELEASE_APP_PRIVATE_KEY` secret.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release PR or tag
        uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run release
          # We don't publish to npm; `bun run release` runs `changeset git-tag`,
          # which tags the release locally. The action then creates the tag and
          # a GitHub Release through the API with `github-token`, and the Docker
          # workflow builds the image from its `push: tags: ['v*']` trigger.
          # v2 reads the token only from this input, not from the
          # `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}
          create-github-releases: true
